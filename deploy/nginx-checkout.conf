# /etc/nginx/sites-available/checkout.ninjjakoffe.site
# Reverse proxy + HTTPS for the Chargebee custom checkout.
# Install:  sudo cp deploy/nginx-checkout.conf /etc/nginx/sites-available/checkout.ninjjakoffe.site
#           sudo ln -sf /etc/nginx/sites-available/checkout.ninjjakoffe.site /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Cert:     sudo certbot --nginx -d checkout.ninjjakoffe.site

# --- HTTP: keep ACME challenge open, redirect everything else to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name checkout.ninjjakoffe.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name checkout.ninjjakoffe.site;

    ssl_certificate     /etc/letsencrypt/live/checkout.ninjjakoffe.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/checkout.ninjjakoffe.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers. NOTE: no Content-Security-Policy here on purpose —
    # Chargebee.js loads card iframes from js.chargebee.com and the gateway,
    # so a strict CSP needs to be written carefully or payments break.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Never cache the checkout HTML (it holds the publishable key + config).
    location = /checkout {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
