<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vielen Dank</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        padding: 80px 16px;
        background: #f7f8fa;
        font-family: Arial, sans-serif;
      }
      .box {
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 12px;
        padding: 40px;
        max-width: 420px;
        text-align: center;
      }
      h1 { font-size: 20px; }
      p { color: #555; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>✅ Vielen Dank für Ihre Bestellung!</h1>
      <p>Eine Bestätigungs-E-Mail ist unterwegs.</p>
    </div>
  </body>
</html>
