<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout cancelled</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        padding: 80px 16px;
        background: #f7f8fa;
        font-family: Arial, sans-serif;
      }
      .box {
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 12px;
        padding: 40px;
        max-width: 420px;
        text-align: center;
      }
      h1 { font-size: 20px; }
      p { color: #555; font-size: 14px; }
      a { color: #111827; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Checkout cancelled</h1>
      <p>No charge was made. You can try again anytime.</p>
      <p><a href="/">← Back</a></p>
    </div>
  </body>
</html>
