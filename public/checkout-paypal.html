<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kasse</title>
    <link rel="stylesheet" href="/checkout.css" />
    <link rel="stylesheet" href="/checkout-paypal.css" />

    <!-- Chargebee.js (required for the PayPal Payment Method Helper) -->
    <script src="https://js.chargebee.com/v2/chargebee.js"></script>
  </head>
  <body>
    <div class="checkout-page">
      <header class="checkout-header">
        <span class="checkout-logo">GLOBOMARTS</span>
      </header>

      <div class="checkout-layout">
        <!-- ===================== LEFT: FORM ===================== -->
        <main class="checkout-form">
          <!-- Account information -->
          <section class="checkout-section">
            <h2 class="section-title">Kontoinformationen</h2>

            <div class="field-row">
              <div class="field">
                <label for="first_name">Vorname<span class="req">*</span></label>
                <input type="text" id="first_name" name="first_name" autocomplete="given-name" />
              </div>
              <div class="field">
                <label for="last_name">Nachname<span class="req">*</span></label>
                <input type="text" id="last_name" name="last_name" autocomplete="family-name" />
              </div>
            </div>

            <div class="field">
              <label for="email">E-Mail-Adresse<span class="req">*</span></label>
              <input type="email" id="email" name="email" autocomplete="email" />
            </div>

            <div class="field">
              <label for="phone">Telefonnummer</label>
              <input type="tel" id="phone" name="phone" autocomplete="tel" />
            </div>

            <div class="field">
              <label for="company">Firmenname</label>
              <input type="text" id="company" name="company" autocomplete="organization" />
            </div>
          </section>

          <!-- Billing address -->
          <section class="checkout-section">
            <h2 class="section-title">Rechnungsadresse</h2>

            <div class="field">
              <label for="address_line1">Adresse Zeile 1<span class="req">*</span></label>
              <input type="text" id="address_line1" name="address_line1" autocomplete="address-line1" />
            </div>

            <div class="field">
              <label for="address_line2">Adresse Zeile 2</label>
              <input type="text" id="address_line2" name="address_line2" autocomplete="address-line2" />
            </div>

            <div class="field-row">
              <div class="field">
                <label for="city">Stadt<span class="req">*</span></label>
                <input type="text" id="city" name="city" autocomplete="address-level2" />
              </div>
              <div class="field">
                <label for="zip">Postleitzahl<span class="req">*</span></label>
                <input type="text" id="zip" name="zip" autocomplete="postal-code" />
              </div>
            </div>

            <div class="field-row">
              <div class="field">
                <label for="country">Land<span class="req">*</span></label>
                <select id="country" name="country">
                  <option value="DE" selected>Deutschland</option>
                  <option value="AT">Österreich</option>
                  <option value="CH">Schweiz</option>
                  <option value="NL">Niederlande</option>
                  <option value="BE">Belgien</option>
                  <option value="FR">Frankreich</option>
                  <option value="US">Vereinigte Staaten</option>
                  <option value="GB">Vereinigtes Königreich</option>
                </select>
              </div>
              <!-- Free-text Bundesland, as in the reference design -->
              <div class="field">
                <label for="state">Bundesland<span class="req">*</span></label>
                <input type="text" id="state" name="state" autocomplete="address-level1" />
              </div>
            </div>
          </section>

          <!-- Payment method: PayPal only -->
          <section class="checkout-section">
            <h2 class="section-title">Zahlungsmethode</h2>

            <button type="button" id="paypal-button" class="paypal-button paypal-button--navy">
              <svg class="paypal-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M7.08 20.5c-.06.4-.3.5-.6.5h-2.2c-.4 0-.5-.2-.4-.6L6.6 5.2c.06-.4.3-.5.6-.5h4.4c2.5 0 4.2 1.2 4.2 3.4 0 2.6-2 4.2-4.6 4.2H8.6l-.7 4.4-.8 3.8zM12.4 3.7c.3-.2.6-.3 1-.3h3.6c2.6 0 4.4 1.1 4.4 3.5 0 2.9-2.3 4.7-5.3 4.7h-2.2l-.7 4.4-.8 3.8c-.06.4-.3.5-.6.5h-2.2c-.4 0-.5-.2-.4-.6l2.2-12.7c.06-.4.3-.5.6-.5h1.4l-1 2.6z"/>
              </svg>
              Mit PayPal bezahlen
            </button>
          </section>
        </main>

        <!-- ===================== RIGHT: ORDER OVERVIEW ===================== -->
        <aside class="order-card">
          <h2 class="order-title">Bestellübersicht</h2>

          <div class="price-line">
            <span id="price-line" class="price-amount">49,99 €</span>
          </div>

          <hr class="rule-1" />

          <div class="total-line">
            <span>Gesamtsumme</span>
            <strong id="total-amount">49,99 €</strong>
          </div>

          <div class="secure-text">
            <svg class="secure-lock" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 1 1 6 0v3H9z"/></svg>
            <span>Sicherer Checkout powered by Chargebee</span>
          </div>
        </aside>
      </div>
    </div>

    <div id="error-banner" class="error-banner" hidden></div>

    <script src="/checkout-paypal.js"></script>
  </body>
</html>
